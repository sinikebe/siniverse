name: Concept browser review

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
    paths:
      - 'public/concepts/**'
      - 'public/_headers'
      - 'tools/build.mjs'
      - 'tools/check-concepts-browser.mjs'
      - '.github/workflows/concepts-browser.yml'
  push:
    branches: [dev]
    paths:
      - 'public/concepts/**'
      - 'public/_headers'
      - 'tools/build.mjs'
      - 'tools/check-concepts-browser.mjs'
      - '.github/workflows/concepts-browser.yml'

permissions:
  contents: read

concurrency:
  group: concept-browser-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  browser:
    if: github.repository == 'sinikebe/siniverse' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build review assets with Node core only
        run: node tools/build.mjs
      - name: Exercise the installed system Chrome without downloads
        run: node tools/check-concepts-browser.mjs
      - name: Save small screenshots and the journey report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: siniverse-concepts-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-review/
          retention-days: 1
          compression-level: 6
          if-no-files-found: warn
