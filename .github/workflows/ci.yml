name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publier sur main ou mettre à jour le Preview dev après validation
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: siniverse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    if: github.repository == 'sinikebe/siniverse' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Use the shared npm version
        run: npm install --global npm@11.19.1 --no-audit --no-fund
      - name: Install pinned dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Verify homepage, privacy and persistent Drive sessions
        run: npm test
      - name: Validate site and API packaging without credentials
        run: npm run build

  deploy:
    needs: check
    if: github.repository == 'sinikebe/siniverse' && github.event.repository.private == false && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Use the shared npm version
        run: npm install --global npm@11.19.1 --no-audit --no-fund
      - name: Install pinned deployment CLI
        run: npm ci
      - name: Build the site assets for publication
        run: npm run ci:build
      - name: Publish site and API production or the stable site Preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_DEPLOY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            if [[ "$MANUAL_DEPLOY_REQUESTED" == "true" ]]; then
              echo "::error::Manual deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
              exit 1
            fi
            echo "::notice::Deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            echo "### Deployment skipped: Cloudflare credentials are not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$CLOUDFLARE_ACCOUNT_ID" != "bbc2341709439fad81d7aebc62efb873" ]]; then
            echo "::error::The Cloudflare account does not match the existing Siniverse Worker."
            exit 1
          fi

          require_current_head() {
            local current_head
            current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
            if [[ "$current_head" != "$GITHUB_SHA" ]]; then
              echo "::error::Deployment refused: this commit is no longer the branch head."
              exit 1
            fi
          }

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            require_current_head
            npm run deploy
            require_current_head
            npm run deploy:api
          elif [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            require_current_head
            npm run deploy:preview
          else
            echo "::error::Unsupported deployment branch: $GITHUB_REF"
            exit 1
          fi
